server {
    listen 80;
    server_name service.example.invalid;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name service.example.invalid;

    ssl_certificate /etc/letsencrypt/live/deployment.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deployment.example.invalid/privkey.pem;

    location ^~ /paykitodo-sync/ {
        proxy_pass http://127.0.0.1:36568/;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 30s;
        client_max_body_size 40m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:36567;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
